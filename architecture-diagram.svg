<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400" role="img" aria-labelledby="title desc">
  <title id="title">AI Family Tutor architecture</title>
  <desc id="desc">A child and parent use the tutor web app. The app talks to a tutoring engine, learning-progress database, safety validation and an AI gateway. The gateway routes to local Ollama by default and optional enterprise AI providers when enabled.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#334155"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1d4ed8"/></marker>
    <style>
      .box{stroke:#334155;stroke-width:3;rx:22;ry:22}.label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033;text-anchor:middle}.title{font-size:42px;font-weight:700}.sub{font-size:27px;fill:#475569}.node{font-size:32px;font-weight:650}.tiny{font-size:23px;fill:#475569}.line{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#1d4ed8;stroke-width:4;stroke-dasharray:12 12;marker-end:url(#arrowBlue)}.tag{font-size:22px;fill:#1d4ed8;font-weight:600}.legend{font-size:23px;fill:#475569}
    </style>
  </defs>
  <rect width="2400" height="1400" fill="#f8fafc"/>
  <text x="1200" y="85" class="label title">AI Family Tutor — Local-first, enterprise-ready</text>
  <text x="1200" y="130" class="label sub">Ollama is the default. Cloud AI is an explicit, controlled plug-in.</text>

  <rect x="80" y="300" width="260" height="125" class="box" fill="#e0f2fe"/>
  <text x="210" y="350" class="label node">Child</text><text x="210" y="391" class="label tiny">answers questions</text>
  <rect x="80" y="580" width="260" height="125" class="box" fill="#fef3c7"/>
  <text x="210" y="630" class="label node">Parent</text><text x="210" y="671" class="label tiny">reviews progress</text>
  <rect x="450" y="390" width="310" height="180" class="box" fill="#dbeafe"/>
  <text x="605" y="455" class="label node">Tutor web app</text><text x="605" y="500" class="label tiny">child view · parent view</text>

  <rect x="880" y="360" width="390" height="240" class="box" fill="#e0e7ff"/>
  <text x="1075" y="430" class="label node">Tutoring engine</text><text x="1075" y="478" class="label tiny">questions · hints · marking</text><text x="1075" y="515" class="label tiny">mastery progression</text>
  <rect x="900" y="755" width="350" height="145" class="box" fill="#dcfce7"/>
  <text x="1075" y="812" class="label node">Learning progress</text><text x="1075" y="853" class="label tiny">SQLite → production database</text>
  <rect x="1430" y="310" width="375" height="155" class="box" fill="#fee2e2"/>
  <text x="1618" y="370" class="label node">Safety check</text><text x="1618" y="410" class="label tiny">JSON validation · child-safe output</text>
  <rect x="1420" y="600" width="400" height="190" class="box" fill="#ede9fe"/>
  <text x="1620" y="668" class="label node">AI gateway</text><text x="1620" y="713" class="label tiny">one stable provider interface</text><text x="1620" y="750" class="label tiny">routing · cost · fallback</text>

  <rect x="2020" y="210" width="300" height="160" class="box" fill="#dcfce7"/>
  <text x="2170" y="273" class="label node">Ollama</text><text x="2170" y="315" class="label tiny">local AI model</text>
  <rect x="1950" y="525" width="410" height="310" class="box" fill="#eff6ff"/>
  <text x="2155" y="580" class="label node">Optional enterprise AI</text>
  <text x="2155" y="634" class="label tiny">OpenAI / Azure OpenAI</text>
  <text x="2155" y="684" class="label tiny">Anthropic Claude</text>
  <text x="2155" y="734" class="label tiny">Google Vertex AI / Gemini</text>
  <text x="2155" y="784" class="label tiny">other approved provider</text>

  <path d="M340 362 H450" class="line"/><path d="M340 642 H395 Q420 642 420 570 V510 H450" class="line"/>
  <path d="M760 480 H880" class="line"/><path d="M1075 600 V755" class="line"/><path d="M1250 827 H1320 Q1350 827 1350 770 V620 H1270" class="line"/>
  <path d="M1270 420 H1430" class="line"/><path d="M1618 465 V535 Q1618 570 1570 570 H1490 Q1420 570 1420 625" class="line"/>
  <path d="M1620 600 V500 Q1620 480 1650 480 H1805" class="line"/><path d="M1820 690 H2020 V370" class="line"/>
  <path d="M1820 695 H1920 Q1940 695 1940 680 V680 H1950" class="dash"/>
  <text x="1885" y="642" class="tag">only when enabled</text>

  <rect x="110" y="1125" width="2180" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="180" cy="1190" r="13" fill="#334155"/><text x="215" y="1198" class="legend" text-anchor="start">Default route: private learning requests stay local with Ollama.</text>
  <line x1="1060" y1="1190" x2="1130" y2="1190" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="12 12"/><text x="1160" y="1198" class="legend" text-anchor="start">Cloud route: parent-approved, de-identified, and controlled by policy.</text>
</svg>
