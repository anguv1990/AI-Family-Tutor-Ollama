<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutor</title>
<style>
  /* Spike-grade styling. The only deliberate choices here are the ones under
     test: tap-target size, contrast and type scale for a 4-5 year old. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    background: #f4f7fb;
    color: #12233b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }
  .screen { display: none; width: 100%; max-width: 760px; text-align: center; }
  .screen.on { display: block; }

  h1 { font-size: clamp(28px, 6vw, 44px); margin: 0 0 32px; }

  .question {
    font-size: clamp(44px, 11vw, 88px);
    font-weight: 700;
    margin: 0 0 8px;
    line-height: 1.15;
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 24px 0;
  }
  @media (min-width: 560px) { .pad { grid-template-columns: repeat(6, 1fr); } }

  button {
    font-family: inherit;
    font-weight: 700;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* Minimum 88px square: larger than the 44px adult guideline, because small
     fingers and imprecise aim are the whole point of this test. */
  .num {
    aspect-ratio: 1;
    min-height: 88px;
    font-size: clamp(30px, 7vw, 42px);
    background: #ffffff;
    color: #12233b;
    box-shadow: 0 3px 0 #c6d3e4;
  }
  .num:active { transform: translateY(3px); box-shadow: none; }

  .big {
    font-size: clamp(24px, 5vw, 34px);
    padding: 22px 36px;
    min-height: 88px;
    background: #2f6fed;
    color: #fff;
    box-shadow: 0 4px 0 #1c4fb5;
    margin: 8px;
  }
  .big:active { transform: translateY(4px); box-shadow: none; }
  .big.child { background: #7b4fd8; box-shadow: 0 4px 0 #5a35a8; }

  .speak {
    background: #ffd166;
    color: #4a3200;
    font-size: 30px;
    padding: 16px 28px;
    min-height: 72px;
    box-shadow: 0 4px 0 #d9a83d;
  }

  .skip {
    background: transparent;
    color: #5a6b82;
    font-size: 20px;
    padding: 16px 24px;
    text-decoration: underline;
    box-shadow: none;
  }

  /* Deliberately small and out of the way so a child does not end the session
     by accident, but reachable by the supervising adult. */
  .done {
    position: fixed;
    top: 10px;
    right: 10px;
    background: #e6ecf5;
    color: #5a6b82;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 12px;
  }

  .mark { font-size: clamp(90px, 24vw, 160px); line-height: 1; margin: 0; }
  .verdict { font-size: clamp(26px, 5vw, 38px); font-weight: 700; margin: 12px 0 0; }
  .muted { color: #5a6b82; font-size: 18px; }
  .error { color: #b0233a; font-size: 18px; min-height: 24px; margin-top: 12px; }
</style>
</head>
<body>

<button class="done" id="done" hidden>Finish</button>

<!-- 1. Who is playing. Hard-coded for the spike; two children, per the plan. -->
<section class="screen on" id="screen-start">
  <h1>Who is playing?</h1>
  <button class="big child" data-child="child-a">Child A</button>
  <button class="big child" data-child="child-b">Child B</button>
  <p class="error" id="start-error"></p>
</section>

<!-- 2. The question, read aloud, answered by tapping a number. -->
<section class="screen" id="screen-question">
  <p class="question" id="question-text"></p>
  <button class="speak" id="hear">&#128266; Hear it</button>
  <div class="pad" id="pad"></div>
  <button class="skip" id="skip">Skip this one</button>
  <p class="error" id="question-error"></p>
</section>

<!-- 3. Feedback, then auto-advance. -->
<section class="screen" id="screen-feedback">
  <p class="mark" id="mark"></p>
  <p class="verdict" id="verdict"></p>
</section>

<!-- 4. End of session. -->
<section class="screen" id="screen-end">
  <h1 id="end-title"></h1>
  <p class="muted" id="end-detail"></p>
  <button class="big" id="again">Start again</button>
</section>

<script>
(function () {
  'use strict';

  var state = { sessionId: null, question: null, busy: false };

  function $(id) { return document.getElementById(id); }

  function show(name) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i += 1) screens[i].classList.remove('on');
    $('screen-' + name).classList.add('on');
    $('done').hidden = (name !== 'question');
  }

  // Output only. This speaks text; it never listens, so it carries none of the
  // privacy risk that deferred speech *recognition* does. Whether the chosen
  // voice is fully on-device still needs confirming before this ships.
  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }

  function api(path, options) {
    return fetch(path, options).then(function (response) {
      if (!response.ok) throw new Error('request failed');
      return response.json();
    });
  }

  function post(path, body) {
    var options = { method: 'POST' };
    if (body) {
      options.headers = { 'content-type': 'application/json' };
      options.body = JSON.stringify(body);
    }
    return api(path, options);
  }

  function buildPad() {
    var pad = $('pad');
    pad.innerHTML = '';
    for (var n = 0; n <= 10; n += 1) {
      var button = document.createElement('button');
      button.className = 'num';
      button.textContent = String(n);
      button.setAttribute('aria-label', String(n));
      button.dataset.value = String(n);
      pad.appendChild(button);
    }
  }

  function askQuestion(question) {
    state.question = question;
    $('question-text').textContent = question.prompt;
    $('question-error').textContent = '';
    show('question');
    speak(question.prompt);
  }

  function endSession(title, detail) {
    $('end-title').textContent = title;
    $('end-detail').textContent = detail || '';
    show('end');
    speak(title);
  }

  // Every answered/skipped question routes through here, so "no next question"
  // is handled in exactly one place.
  function advance(result) {
    if (result.nextQuestion) {
      askQuestion(result.nextQuestion);
      return;
    }
    endSession(
      'All done!',
      result.status === 'exhausted'
        ? 'We have run out of questions for now.'
        : ''
    );
  }

  function afterFeedback(result) {
    window.setTimeout(function () {
      state.busy = false;
      advance(result);
    }, 1400);
  }

  function submit(answer) {
    if (state.busy || !state.question) return;
    state.busy = true;

    post('/api/sessions/' + state.sessionId + '/answers', {
      questionId: state.question.id,
      answer: answer
    }).then(function (result) {
      $('mark').textContent = result.correct ? '⭐' : '👍';
      $('verdict').textContent = result.correct ? 'Yes! Well done.' : 'Good try!';
      show('feedback');
      speak(result.correct ? 'Yes! Well done.' : 'Good try!');
      afterFeedback(result);
    }).catch(function () {
      state.busy = false;
      $('question-error').textContent = 'Something went wrong. Try again.';
    });
  }

  function skip() {
    if (state.busy || !state.question) return;
    state.busy = true;

    post('/api/sessions/' + state.sessionId + '/skip', {
      questionId: state.question.id
    }).then(function (result) {
      state.busy = false;
      advance(result);
    }).catch(function () {
      state.busy = false;
      $('question-error').textContent = 'Something went wrong. Try again.';
    });
  }

  function start(childId) {
    $('start-error').textContent = '';
    post('/api/sessions', { childId: childId }).then(function (session) {
      state.sessionId = session.sessionId;
      askQuestion(session.question);
    }).catch(function () {
      $('start-error').textContent =
        'Could not start. Is the server running?';
    });
  }

  document.addEventListener('click', function (event) {
    var target = event.target;

    if (target.dataset && target.dataset.child) start(target.dataset.child);
    if (target.dataset && target.dataset.value) submit(target.dataset.value);
    if (target.id === 'skip') skip();
    if (target.id === 'hear' && state.question) speak(state.question.prompt);
    if (target.id === 'again') show('start');

    if (target.id === 'done' && state.sessionId) {
      post('/api/sessions/' + state.sessionId + '/complete').then(function (summary) {
        endSession(
          'Session finished',
          'Answered ' + summary.questionsAnswered +
          ', skipped ' + summary.questionsSkipped + '.'
        );
      }).catch(function () {
        $('question-error').textContent = 'Could not finish the session.';
      });
    }
  });

  buildPad();
})();
</script>

</body>
</html>
