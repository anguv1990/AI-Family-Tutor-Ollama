<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Tutor</title>
<link rel="icon" href="data:,">
<style>
  /* ---------------------------------------------------------------------
     Designed for a four-to-five-year-old who cannot reliably read:
       - every touch target is at least 88px (twice the adult guideline)
       - body text is never below 20px and the prompt is huge
       - text/background contrast is at least 7:1 everywhere
       - nothing depends on colour alone; selection also changes size,
         border weight and a tick
     --------------------------------------------------------------------- */

  :root {
    --ink: #10233f;          /* 14.6:1 on --paper */
    --ink-soft: #435473;     /*  6.9:1 on --paper */
    --paper: #f2f6fb;
    --card: #ffffff;
    --chosen: #14479e;       /*  9.2:1 against white text */
    --chosen-shadow: #0b2f6e;
    --go: #0f7a3d;           /*  4.9:1 against white text, plus a tick glyph */
    --go-shadow: #0a5a2c;
    --focus: #b3410b;
    --lift: #c3d1e4;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { height: 100%; }

  body {
    margin: 0;
    /* dvh, not vh: on a tablet the browser chrome moves, and vh would leave
       the Send button under it. A four-year-old will not scroll to find it —
       if it is off screen it does not exist. */
    height: 100dvh;
    display: flex;
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 20px;
    line-height: 1.4;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
  }

  /* One clear, always-visible focus style for the keyboard-only run. */
  :focus-visible {
    outline: 5px solid var(--focus);
    outline-offset: 4px;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  main > section {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(4px, 1.2vh, 14px);
  }

  /* The question screen is the one that must fit exactly. Everything in it is
     a fixed height scaled to the viewport, except the picture, which takes
     whatever is left over and shrinks first. */
  #phase-question { justify-content: flex-start; }

  [hidden] { display: none !important; }

  h1, h2 {
    font-size: clamp(30px, 6vw, 46px);
    line-height: 1.2;
    margin: 8px 0 28px;
  }

  .prompt {
    font-size: clamp(24px, 4.6vh, 52px);
    font-weight: 800;
    line-height: 1.1;
    margin: 0;
    flex: 0 0 auto;
  }
  .prompt:focus { outline: none; }

  .notice {
    font-size: clamp(16px, 2.4vh, 24px);
    font-weight: 700;
    color: var(--ink-soft);
    margin: 0;
    min-height: 0;
    flex: 0 0 auto;
  }

  button {
    font-family: inherit;
    font-weight: 800;
    border: 3px solid transparent;
    border-radius: 20px;
    cursor: pointer;
    touch-action: manipulation;
    min-height: clamp(56px, 10vh, 88px);
  }

  /* ---- the picture of the question ------------------------------------
     A four-year-old ignored the spoken prompt and tapped anyway, so text and
     audio between them were reaching nobody. Dots can be counted with a
     finger, which needs no reading and no sound. */
  .picture {
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    align-items: center;
    justify-content: center;
    gap: 0.3rem 0.8rem;
    margin: 0;
    /* The only thing that gives way when the screen is short. */
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
  }

  .dots {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(2.2rem, 2.9rem));
    gap: 0.35rem;
    justify-content: center;
    max-width: 15rem;
  }

  .dot {
    width: clamp(1.3rem, 4.4vh, 2.8rem);
    height: clamp(1.3rem, 4.4vh, 2.8rem);
    border-radius: 50%;
    background: #2f6fd0;
    border: 3px solid #1b4a91;
  }

  .op { font-size: clamp(1.6rem, 5vh, 3.2rem); font-weight: 700; }

  .track { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; justify-content: center; }

  .cell {
    min-width: clamp(3rem, 9vw, 4.2rem);
    padding: 0.3rem 0.5rem;
    border-radius: 0.7rem;
    background: #eef3fb;
    border: 4px solid #2f6fd0;
    font-size: clamp(1.6rem, 5vh, 3rem);
    font-weight: 700;
    text-align: center;
  }

  .cell.blank { border-style: dashed; color: #2f6fd0; }

  .want { font-size: clamp(1.6rem, 5vh, 3rem); }

  /* Why the answer was wrong, in words a four-year-old can act on. */
  .feedback-help {
    font-size: clamp(18px, 3vh, 28px);
    font-weight: 700;
    color: var(--ink-soft);
    max-width: 22ch;
    margin: 0 auto;
  }

  /* The answer being typed, shown big so a child can check it before sending. */
  .typed {
    min-height: 1.2em;
    margin: 0 0 0.4rem;
    font-size: clamp(1.8rem, 5.5vh, 4rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-align: center;
    flex: 0 0 auto;
  }

  .keys { grid-template-columns: repeat(5, minmax(0, 1fr)); }

  /* ---- the number pad -------------------------------------------------- */

  .pad {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: clamp(6px, 1.1vh, 12px);
    margin: 0;
    padding: 0;
    list-style: none;
    flex: 0 0 auto;
    /* Square cells grow with width, so an uncapped pad on a wide tablet would
       be tall enough to push Send off the bottom. */
    max-width: min(100%, 620px);
    margin-inline: auto;
    width: 100%;
  }
  /* Two rows of six at every width: three rows would push Send off screen. */
  @media (max-height: 560px) {
    /* Short landscape: the picture yields first, then the prompt shrinks. */
    .prompt { font-size: clamp(20px, 4vh, 30px); }
    .picture { gap: 0.2rem 0.5rem; }
    .pad { max-width: min(100%, 520px); }
  }

  .num {
    width: 100%;
    aspect-ratio: 1;
    min-width: 0;
    min-height: 88px;
    font-size: clamp(30px, 7vw, 44px);
    background: var(--card);
    color: var(--ink);
    border-color: #d5e0ee;
    box-shadow: 0 4px 0 var(--lift);
  }
  .num:active { transform: translateY(4px); box-shadow: none; }

  .num[aria-pressed="true"] {
    background: var(--chosen);
    color: #ffffff;
    border-color: #06255c;
    box-shadow: 0 4px 0 var(--chosen-shadow);
    transform: scale(1.06);
  }

  /* ---- actions --------------------------------------------------------- */

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: stretch;
    flex: 0 0 auto;
  }

  /* Hear it again, Help me and A different one are secondary: useful, but they
     must never cost the Send button its place on screen. */
  .row.secondary button {
    min-height: clamp(44px, 7vh, 64px);
    font-size: clamp(15px, 2.2vh, 22px);
    padding: 6px 14px;
  }

  .big {
    font-size: clamp(24px, 4.4vw, 32px);
    padding: 18px 30px;
    background: var(--card);
    color: var(--ink);
    border-color: #ccd9ea;
    box-shadow: 0 5px 0 var(--lift);
  }
  .big:active { transform: translateY(5px); box-shadow: none; }

  /* The animal is for the child, who cannot read; the year group is for the
     adult setting them up, who could not tell the buttons apart. */
  .child { display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .child .who { font-size: clamp(24px, 4.4vw, 32px); }
  .child .year {
    font-size: clamp(14px, 2vw, 18px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* The one deliberate, hard-to-miss action that actually sends an answer.
     It is a separate step from tapping a number, and sits well away from the
     pad, because an answer cannot be taken back once it is sent. */
  .send {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: block;
    font-size: clamp(22px, 4vh, 38px);
    padding: clamp(10px, 2vh, 22px) 24px;
    min-height: clamp(64px, 11vh, 104px);
    flex: 0 0 auto;
    background: var(--go);
    color: #ffffff;
    border-color: #073f1e;
    box-shadow: 0 6px 0 var(--go-shadow);
  }
  .send:active { transform: translateY(6px); box-shadow: none; }
  .send.waiting {
    background: #e7edf6;
    color: var(--ink-soft);
    border-color: #ccd9ea;
    box-shadow: 0 6px 0 var(--lift);
  }

  .child { font-size: clamp(26px, 5vw, 36px); padding: 26px 34px; }

  /* Small, out of the way and behind a confirmation, so a child cannot end
     the session with one stray tap, but an adult can always reach it. */
  .finish {
    position: absolute;
    top: 12px;
    right: 12px;
    min-height: 56px;
    font-size: 18px;
    padding: 12px 18px;
    border-radius: 14px;
    background: #e3eaf4;
    color: #33445f;   /* 8.0:1 on #e3eaf4 */
    border-color: #c3d1e4;
    box-shadow: none;
  }

  .hint {
    margin: 0 auto 20px;
    max-width: 640px;
    background: #fff5d8;
    border: 3px solid #d9a83d;
    border-radius: 20px;
    padding: 16px 20px;
    font-size: clamp(21px, 3.6vw, 27px);
    font-weight: 700;
    color: #4a3200;   /* 9.6:1 on #fff5d8 */
  }

  /* ---- feedback, endings, trouble -------------------------------------- */

  .face { font-size: clamp(88px, 22vw, 150px); line-height: 1; margin: 24px 0 0; }
  .verdict { font-size: clamp(28px, 5.4vw, 40px); font-weight: 800; margin: 8px 0 24px; }
  .detail { font-size: clamp(21px, 3.6vw, 27px); color: var(--ink-soft); margin: 0 0 28px; }

  .dots { font-size: clamp(40px, 10vw, 72px); letter-spacing: 0.2em; margin-top: 30vh; }
  .dots span { animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .dots span { animation: none; opacity: 1; }
    .num, .big, .send { transition: none; }
  }

  /* Visually hidden but read by assistive technology. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

<button type="button" class="finish" id="finish-button" hidden>Finish</button>

<main id="main">
  <h1 class="sr-only" id="app-title">Maths practice</h1>

  <!-- Live region: every state change is announced once, in child wording. -->
  <p class="sr-only" id="announce" role="status" aria-live="polite" aria-atomic="true"></p>

  <!-- 1. Who is playing ------------------------------------------------- -->
  <section id="phase-welcome" aria-labelledby="welcome-heading">
    <h2 id="welcome-heading">Who is playing?</h2>
    <div class="row">
      <button type="button" class="big child" data-child="child-a" data-year="reception">
        <span class="who">🦊 Fox</span>
        <span class="year">Reception</span>
      </button>
      <button type="button" class="big child" data-child="child-b" data-year="year3">
        <span class="who">🐼 Panda</span>
        <span class="year">Year 3</span>
      </button>
      <button type="button" class="big child" data-child="child-c" data-year="year2">
        <span class="who">🐢 Turtle</span>
        <span class="year">Year 2</span>
      </button>
    </div>
  </section>

  <!-- 2. Waiting --------------------------------------------------------- -->
  <section id="phase-loading" hidden>
    <p class="dots" aria-hidden="true"><span>●</span><span>●</span><span>●</span></p>
  </section>

  <!-- 3. The question ---------------------------------------------------- -->
  <section id="phase-question" hidden aria-labelledby="prompt">
    <p class="notice" id="notice"></p>
    <h2 class="prompt" id="prompt" tabindex="-1"></h2>

    <div class="picture" id="picture" hidden></div>
    <p class="hint" id="hint" hidden></p>
    <p class="typed" id="typed" aria-live="polite" hidden></p>

    <ul class="pad" id="pad" aria-label="Choose your answer"></ul>
    <ul class="pad keys" id="keypad" aria-label="Type your answer" hidden></ul>

    <button type="button" class="send waiting" id="send-button">Pick a number</button>

    <div class="row secondary">
      <button type="button" class="big" id="hear-button">🔊 Hear it again</button>
      <button type="button" class="big" id="hint-button">💡 Help me</button>
      <button type="button" class="big" id="skip-button">👉 A different one</button>
    </div>
  </section>

  <!-- 4. Feedback -------------------------------------------------------- -->
  <section id="phase-feedback" hidden>
    <p class="face" id="feedback-face" aria-hidden="true"></p>
    <p class="verdict" id="feedback-title"></p>
    <p class="feedback-help" id="feedback-help" hidden></p>
    <button type="button" class="big" id="continue-button">Next one 👉</button>
  </section>

  <!-- 5. Are you finished? ----------------------------------------------- -->
  <section id="phase-finishing" hidden aria-labelledby="finishing-heading">
    <h2 id="finishing-heading">Are you finished for today?</h2>
    <div class="row">
      <button type="button" class="big child" id="keep-going-button">↩️ Keep going</button>
      <button type="button" class="big child" id="really-finish-button">👋 All finished</button>
    </div>
  </section>

  <!-- 6. The end (any status) -------------------------------------------- -->
  <section id="phase-ended" hidden aria-labelledby="ending-title">
    <p class="face" id="ending-face" aria-hidden="true"></p>
    <h2 id="ending-title"></h2>
    <p class="detail" id="ending-message"></p>
    <button type="button" class="big child" id="again-button">🔁 Play again</button>
  </section>

  <!-- 7. Something went wrong -------------------------------------------- -->
  <section id="phase-trouble" hidden aria-labelledby="trouble-title">
    <p class="face" aria-hidden="true">🐛</p>
    <h2 id="trouble-title"></h2>
    <p class="detail" id="trouble-message"></p>
    <button type="button" class="big child" id="retry-button">🔁 Try again</button>
  </section>
</main>

<script type="module">
import {
  answerOptions,
  initialState,
  interpretDigitKey,
  reduce,
} from './session-logic.js';

/* ---------------------------------------------------------------------------
 * This file is deliberately thin: it renders a state, runs the state's command
 * and dispatches the result back. Every decision about what the child sees
 * lives in session-logic.js, which is unit-tested under Node.
 * ------------------------------------------------------------------------- */

const $ = (id) => document.getElementById(id);

const PHASES = ['welcome', 'loading', 'question', 'feedback', 'finishing', 'ended', 'trouble'];

/* --- speech ---------------------------------------------------------------
 * Output only. `speechSynthesis` speaks text; it never opens a microphone and
 * never records, so it carries none of the privacy risk that deferred speech
 * *recognition* does (see plan.md, "Child input and output").
 *
 * ON-DEVICE: this app speaks ONLY through a voice whose `localService` flag is
 * true — the OS voices installed on the machine (on macOS: Daniel, Serena,
 * Samantha, …), which synthesise on the device. Chrome additionally exposes
 * remote "Google …" voices with `localService === false`, which synthesise
 * server-side; `pickLocalVoice()` filters those out, so they are never used
 * here. If no local voice is available the app stays silent and everything
 * else keeps working. plan.md asks for local-only behaviour to be recorded:
 * the policy is enforced by `pickLocalVoice()` below, but the flag is the
 * browser's own assertion rather than a proof, so an adult should still
 * confirm on the target machine that the chosen voice still speaks with the
 * network disconnected before a child uses it.
 * ------------------------------------------------------------------------ */

const speech = {
  supported: typeof window.speechSynthesis !== 'undefined',
  voice: null,
};

function pickLocalVoice() {
  if (!speech.supported) return null;
  let voices = [];
  try {
    voices = window.speechSynthesis.getVoices() || [];
  } catch {
    return null;
  }
  const local = voices.filter((voice) => voice.localService === true);
  if (local.length === 0) return null;
  return (
    local.find((voice) => voice.lang === 'en-GB') ||
    local.find((voice) => voice.lang && voice.lang.startsWith('en')) ||
    local[0]
  );
}

if (speech.supported) {
  speech.voice = pickLocalVoice();
  window.speechSynthesis.addEventListener('voiceschanged', () => {
    speech.voice = pickLocalVoice();
  });
}

function speak(text) {
  if (!speech.supported || !text) return;
  if (!speech.voice) speech.voice = pickLocalVoice();
  if (!speech.voice) return;   // degrade silently, never block the session

  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.voice = speech.voice;
    utterance.lang = speech.voice.lang || 'en-GB';
    utterance.rate = 0.85;   // slow enough for a four-year-old to follow
    utterance.pitch = 1.05;
    window.speechSynthesis.speak(utterance);
  } catch {
    /* Speech is a convenience layer; its failure must never stop the session. */
  }
}

/* --- the API ------------------------------------------------------------- */

const params = new URLSearchParams(window.location.search);
const SKILL_ID = params.get('skill') || undefined;

async function request(path, body) {
  const response = await fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  if (!response.ok) {
    // The status is kept so the caller can tell "the server said no" from
    // "the server is not there"; neither ever reaches the child as a number.
    const failure = new Error('request_failed');
    failure.status = response.status;
    throw failure;
  }
  return response.json();
}

/* Each command maps to one request and one follow-up event. A failure becomes
   a child-facing "trouble" state, never a code or a stack trace. */
async function run(command) {
  switch (command.kind) {
    case 'start':
      return {
        type: 'started',
        response: await request('/api/sessions', {
          childId: command.childId,
          skillId: command.skillId || SKILL_ID,
          yearGroup: command.yearGroup,
        }),
      };
    case 'answer':
      return {
        type: 'graded',
        response: await request(`/api/sessions/${command.sessionId}/answers`, {
          questionId: command.questionId,
          answer: command.answer,
        }),
      };
    case 'skip':
      return {
        type: 'skipped',
        response: await request(`/api/sessions/${command.sessionId}/skip`, {
          questionId: command.questionId,
        }),
      };
    case 'complete':
      return {
        type: 'finished',
        response: await request(`/api/sessions/${command.sessionId}/complete`),
      };
    case 'hint':
      // The hint is a bonus, not part of the deterministic loop: if the model
      // or the route is unavailable the child gets a safe written hint instead.
      return {
        type: 'hinted',
        response: await request(`/api/sessions/${command.sessionId}/hint`),
      };
    default:
      return null;
  }
}

/* --- the loop ------------------------------------------------------------ */

let state = initialState();
let advanceTimer = null;

function dispatch(event) {
  const next = reduce(state, event);
  if (next === state) return;
  state = next;

  // Read everything off the new state before doing anything that could
  // dispatch again, so one event is always handled exactly once.
  const { command, speak: line, phase } = state;

  render();
  if (line) speak(line);

  if (phase === 'feedback') {
    // Long enough to hear the praise and see the star; the child can also tap
    // "Next one" straight away. Speech is never on the critical path.
    window.clearTimeout(advanceTimer);
    advanceTimer = window.setTimeout(() => {
      if (state.phase === 'feedback') dispatch({ type: 'continue' });
    }, 2600);
  }

  if (command) {
    run(command)
      .then((event) => { if (event) dispatch(event); })
      .catch((error) => {
        // A hint is optional, so its failure is invisible. A refused start
        // means there is nothing to ask (every question is inside its re-ask
        // window), which is an ending, not a retry. Everything else is a
        // "we can't hear the tutor" screen with one big Try again.
        if (command.kind === 'hint') dispatch({ type: 'hint-failed' });
        else if (command.kind === 'start' && error && error.status === 400) dispatch({ type: 'no-questions' });
        else dispatch({ type: 'failed' });
      });
  }
}

/* --- rendering ----------------------------------------------------------- */

const pad = $('pad');
const keypad = $('keypad');

/* Two ways to answer, one rule: building an answer is reversible and only the
   Send button submits it. Reception taps a number from the row; Year 3 answers
   run past ten, so they are typed digit by digit. */
for (const value of ['1','2','3','4','5','6','7','8','9','0']) {
  const item = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'num';
  button.textContent = value;
  button.dataset.digit = value;
  button.setAttribute('aria-label', value);
  item.appendChild(button);
  keypad.appendChild(item);
}
{
  const item = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'num rub';
  button.textContent = '⌫';
  button.dataset.rubOut = 'yes';
  button.setAttribute('aria-label', 'Rub out the last digit');
  item.appendChild(button);
  keypad.appendChild(item);
}

for (const value of answerOptions()) {
  const item = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'num';
  button.textContent = value;
  button.dataset.value = value;
  button.id = `num-${value}`;
  button.setAttribute('aria-pressed', 'false');
  button.setAttribute('aria-label', value);
  item.appendChild(button);
  pad.appendChild(item);
}

const picture = $('picture');

/* Builds the picture with the DOM rather than innerHTML: nothing here is ever
   built from server text, and it stays that way by construction. */
function renderPicture(visual) {
  picture.replaceChildren();
  picture.hidden = !visual;
  if (!visual) return;

  const dots = (count) => {
    const group = document.createElement('div');
    group.className = 'dots';
    for (let index = 0; index < count; index += 1) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      group.appendChild(dot);
    }
    return group;
  };

  const symbol = (text, className) => {
    const node = document.createElement('span');
    node.className = className;
    node.textContent = text;
    return node;
  };

  if (visual.kind === 'groups') {
    visual.groups.forEach((count, index) => {
      if (index > 0) picture.appendChild(symbol('+', 'op'));
      picture.appendChild(dots(count));
    });
    picture.setAttribute('aria-label', `${visual.groups.join(' plus ')} dots`);
    return;
  }

  if (visual.kind === 'count') {
    picture.appendChild(dots(visual.total));
    picture.setAttribute('aria-label', `${visual.total} dots`);
    return;
  }

  if (visual.kind === 'sequence') {
    const track = document.createElement('div');
    track.className = 'track';
    for (const value of visual.shown) track.appendChild(symbol(String(value), 'cell'));
    // The empty box is the question: this is the one the child fills in.
    track.appendChild(symbol('?', 'cell blank'));
    picture.appendChild(track);
    picture.setAttribute('aria-label', `${visual.shown.join(', ')}, then what?`);
    return;
  }

  const track = document.createElement('div');
  track.className = 'track';
  if (visual.want) track.appendChild(symbol(visual.want === 'bigger' ? '▲' : '▼', 'want'));
  for (const value of visual.values) track.appendChild(symbol(String(value), 'cell'));
  picture.appendChild(track);
  picture.setAttribute(
    'aria-label',
    visual.want
      ? `Which is ${visual.want}: ${visual.values.join(' or ')}`
      : `The number ${visual.values.join(' ')}`,
  );
}

let lastPhase = null;

function render() {
  for (const phase of PHASES) $(`phase-${phase}`).hidden = state.phase !== phase;
  $('finish-button').hidden = !(state.phase === 'question' || state.phase === 'feedback');

  $('announce').textContent = state.announce || '';

  $('notice').textContent = state.notice || '';
  $('prompt').textContent = state.question ? state.question.prompt : '';

  renderPicture(state.question && state.question.visual);

  const typing = state.answerEntry === 'keypad';
  pad.hidden = typing;
  keypad.hidden = !typing;
  $('typed').hidden = !typing;
  $('typed').textContent = state.selected === null ? '' : state.selected;

  for (const button of pad.querySelectorAll('.num')) {
    button.setAttribute('aria-pressed', String(button.dataset.value === state.selected));
  }

  const send = $('send-button');
  const ready = state.selected !== null;
  send.textContent = ready ? `✔️ Send ${state.selected}` : 'Pick a number';
  send.classList.toggle('waiting', !ready);
  send.disabled = state.busy;
  $('skip-button').disabled = state.busy;

  const hint = $('hint');
  hint.hidden = !state.hint;
  hint.textContent = state.hint || '';
  $('hint-button').disabled = state.hintPending || state.busy;

  if (state.feedback) {
    $('feedback-face').textContent = state.feedback.emoji;
    $('feedback-title').textContent = state.feedback.title;
    $('feedback-help').textContent = state.feedback.help || '';
    $('feedback-help').hidden = !state.feedback.help;
  }

  if (state.ending) {
    $('ending-face').textContent = state.ending.emoji;
    $('ending-title').textContent = state.ending.title;
    $('ending-message').textContent = state.ending.message;
  }

  if (state.trouble) {
    $('trouble-title').textContent = state.trouble.title;
    $('trouble-message').textContent = state.trouble.message;
  }

  // Move focus once per phase change so a keyboard or screen-reader user lands
  // somewhere sensible, without snatching focus while the child is tapping.
  if (state.phase !== lastPhase) {
    lastPhase = state.phase;
    const landing = {
      question: 'prompt',
      feedback: 'continue-button',
      finishing: 'keep-going-button',
      ended: 'again-button',
      trouble: 'retry-button',
    }[state.phase];
    if (landing) $(landing).focus({ preventScroll: true });
  }
}

/* --- input --------------------------------------------------------------- */

document.addEventListener('click', (event) => {
  const target = event.target.closest('button');
  if (!target) return;

  // The child buttons now wrap two spans, so a tap can land on a child node.
  const chooser = target.closest ? target.closest('[data-child]') : null;
  if (chooser) {
    return dispatch({
      type: 'start',
      childId: chooser.dataset.child,
      skillId: SKILL_ID,
      yearGroup: chooser.dataset.year,
    });
  }
  if (target.dataset.digit) return dispatch({ type: 'digit', value: target.dataset.digit });
  if (target.dataset.rubOut) return dispatch({ type: 'rub-out' });
  if (target.dataset.value) return dispatch({ type: 'select', value: target.dataset.value });

  switch (target.id) {
    case 'send-button': return dispatch({ type: 'confirm' });
    case 'skip-button': return dispatch({ type: 'skip' });
    case 'hint-button': return dispatch({ type: 'hint' });
    case 'hear-button': return speak(state.question ? state.question.prompt : '');
    case 'continue-button': return dispatch({ type: 'continue' });
    case 'finish-button': return dispatch({ type: 'ask-finish' });
    case 'keep-going-button': return dispatch({ type: 'cancel-finish' });
    case 'really-finish-button': return dispatch({ type: 'finish' });
    case 'retry-button': return dispatch({ type: 'retry' });
    case 'again-button': return dispatch({ type: 'restart' });
    default: return undefined;
  }
});

let chord = null;

document.addEventListener('keydown', (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  if (state.answerEntry === 'keypad') {
    if (/^[0-9]$/.test(event.key)) {
      event.preventDefault();
      return dispatch({ type: 'digit', value: event.key });
    }
    if (event.key === 'Backspace') {
      event.preventDefault();
      return dispatch({ type: 'rub-out' });
    }
  }

  const digit = interpretDigitKey(event.key, chord, Date.now());
  chord = digit.chord;
  if (digit.value !== null && state.answerEntry !== 'keypad') {
    event.preventDefault();
    dispatch({ type: 'select', value: digit.value });
    // Pressing a number puts the child (or the adult testing with a keyboard)
    // one Enter away from sending it, and Enter then lands on a real button
    // rather than on a global shortcut.
    if (state.selected === digit.value) $('send-button').focus({ preventScroll: true });
    return;
  }

  if (event.key === 'Escape' && state.phase === 'finishing') {
    return dispatch({ type: 'cancel-finish' });
  }

  // Enter on a focused button is the button's job; only handle the stray case
  // where focus is on the page itself, so one key press never means two things.
  if (event.key === 'Enter' && !(event.target instanceof HTMLButtonElement)) {
    if (state.phase === 'question') { event.preventDefault(); dispatch({ type: 'confirm' }); }
    else if (state.phase === 'feedback') { event.preventDefault(); dispatch({ type: 'continue' }); }
  }
});

// If a child is named in the URL an adult can skip the chooser entirely.
const preselected = params.get('child');
if (preselected) dispatch({ type: 'start', childId: preselected, skillId: SKILL_ID });
else render();
</script>

</body>
</html>
